name: deploy-itch

# Auto-deploy the Phaser web build to itch.io via butler (itch's push CLI).
# itch does NOT pull from GitHub — this job pushes to it on every change to the
# Phaser tree that lands on main, and can also be run by hand from the Actions
# tab (workflow_dispatch).
#
# Requires two repo settings (Settings → Secrets and variables → Actions):
#   - Secret   BUTLER_API_KEY : an itch.io API key (itch.io → Settings → API keys)
#   - Variable ITCH_TARGET    : "<itch-username>/<game-slug>" e.g. maxkol93/einstein
on:
  push:
    branches: [main]
    paths:
      - 'phaser/**'
      - 'shared/**'
      - '.github/workflows/deploy-itch.yml'
  workflow_dispatch:

concurrency:
  group: deploy-itch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check config
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::error::Set the BUTLER_API_KEY secret and the ITCH_TARGET variable" \
                 "(Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: phaser
        run: |
          npm ci
          npm run build

      # A downloadable copy of the web build, attached to the Actions run so it
      # can be grabbed and uploaded to the main itch project by hand after
      # testing the staging build. Downloads as "einstein-1.0.<run>.zip" with
      # index.html at the root (ready to drop straight into itch).
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: einstein-1.0.${{ github.run_number }}
          path: phaser/dist
          if-no-files-found: error

      - name: Install butler
        run: |
          # --retry-all-errors so a transient DNS/connection blip to broth is retried
          curl -fSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push phaser/dist "${{ vars.ITCH_TARGET }}:web" \
            --userversion "1.0.${{ github.run_number }}"
